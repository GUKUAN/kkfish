# kkfish 鱼钩配置文件
# 鱼钩配置示例
# 你可以通过各种属性和效果创建自定义鱼钩
# 鱼钩配置示例（添加到 hooks: 节点下）:
# custom-diamond-hook:
#   material: "DIAMOND_BLOCK"
#   custom-model-data: -1
#   display-name: "&b自定义钻石鱼钩"
#   description: "&7一个具有独特效果的强力鱼钩"
#   permissions: ["kkfish.hooks.custom"]
#   rarity: "legendary"
#   effects:
#     bite-rate-bonus: 0.3  # +30% 咬钩几率
#     rare-fish-chance: 0.2  # +20% 稀有鱼几率
#   price:
#     vault: 1000.0  # 金币价格
#     points: 200    # 点券价格
#   # 其他配置项...
