        style: "SEGMENTED_20"
      
      scoreboard:
        enabled: true
        title: "&e&l特殊单条鱼价值比赛"
        lines:
          "&e&l当前排名:": 1
          "&f": -1
          "&61st: %player_1% - %value_1%": 5
