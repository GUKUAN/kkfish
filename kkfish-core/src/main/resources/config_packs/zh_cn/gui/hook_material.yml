menu_title: '&8&l鱼钩材质选择'
update_interval: 1
size: 54
items:
  'Border_Glass':
    material: gray_stained_glass_pane
    slots:
      - 0-8
      - 45-53
    display_name: '&8[&7边框&8]'
    lore:
      - '&7别碰我 (。・ω・。)'
    left_click_commands: []
    right_click_commands: []
  'hook_material_items':
    material: '%hook_material_item%'
    slots:
      - 10-16
      - 19-25
      - 28-34
      - 37-43
    display_name: '&8[&a%hook_name%&8]'
    lore:
      - '&7等级: %hook_level%'
      - '&7价格: %hook_price% 金币'
      - '&7耐久: %hook_durability%'
      - '&7效果: %hook_effect%'
      - '&r'
      - '&7状态: %hook_status%'
      - '&7操作: %hook_action%'
    left_click_commands:
      - '[sound] block.stone_button.click_on 100 1'
      - '[action] buy hook %hook_id%'
    right_click_commands:
      - '[sound] block.stone_button.click_on 100 1'
      - '[action] buy hook %hook_id%'
  'Previous_Page':
    material: arrow
    slot: 48
    display_name: '&8[&a上一页&8]'
    lore:
      - '&7点击查看上一页'
    left_click_commands:
      - '[sound] block.stone_button.click_on 100 1'
      - '[action] hook_page previous'
    right_click_commands:
      - '[sound] block.stone_button.click_on 100 1'
      - '[action] hook_page previous'
  'Next_Page':
    material: arrow
    slot: 50
    display_name: '&8[&a下一页&8]'
    lore:
      - '&7点击查看下一页'
    left_click_commands:
      - '[sound] block.stone_button.click_on 100 1'
      - '[action] hook_page next'
    right_click_commands:
      - '[sound] block.stone_button.click_on 100 1'
      - '[action] hook_page next'
  'Back_Button':
    material: barrier
    slot: 45
    display_name: '&8[&c返回&8]'
    lore:
      - '&7点击返回主菜单'
    left_click_commands:
      - '[sound] block.ender_chest.close 100 0.5'
      - '[action] open_gui main_menu'
    right_click_commands:
      - '[sound] block.ender_chest.close 100 0.5'
      - '[action] open_gui main_menu'
