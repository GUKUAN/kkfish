menu_title: '&8&l鱼类图鉴'
update_interval: 1
size: 54
items:
  'Border_Glass':
    material: gray_stained_glass_pane
    slots:
      - 0-8
      - 45-53
    display_name: '&8[&7边框&8]'
    lore:
      - '&7别碰我 (。・ω・。)'
    left_click_commands: []
    right_click_commands: []
  'fish_dex_items':
    material: '%fish_dex_item%'
    slots:
      - 10-16
      - 19-25
      - 28-34
      - 37-43
    unlocked:
      display_name: '&8[&a%fish_name%&8]'
      lore:
        - '&7等级: %fish_level%'
        - '&7价值: %fish_value% 金币'
        - '&7大小: %fish_min_size%-%fish_max_size%cm'
        - '&7捕获次数: %fish_caught% 次'
        - '&7最大尺寸: %fish_max_caught_size%cm'
    locked:
      display_name: '&8[&c???&8]'
      lore:
        - '&7未知鱼类'
        - '&c你还没有发现这种鱼！'
        - '&f'
        - '&6[提示]'
        - '&e捕获此鱼可解锁详细信息！'
    left_click_commands: []
    right_click_commands: []
  'Previous_Page':
    material: arrow
    slot: 48
    display_name: '&8[&a上一页&8]'
    lore:
      - '&7点击查看上一页'
    left_click_commands:
      - '[sound] block.stone_button.click_on 100 1'
      - '[action] fish_dex_page previous'
    right_click_commands:
      - '[sound] block.stone_button.click_on 100 1'
      - '[action] fish_dex_page previous'
  'Next_Page':
    material: arrow
    slot: 50
    display_name: '&8[&a下一页&8]'
    lore:
      - '&7点击查看下一页'
    left_click_commands:
      - '[sound] block.stone_button.click_on 100 1'
      - '[action] fish_dex_page next'
    right_click_commands:
      - '[sound] block.stone_button.click_on 100 1'
      - '[action] fish_dex_page next'
  'Back_Button':
    material: barrier
    slot: 45
    display_name: '&8[&c返回&8]'
    lore:
      - '&7点击返回主菜单'
    left_click_commands:
      - '[sound] block.ender_chest.close 100 0.5'
      - '[action] open_gui main_menu'
    right_click_commands:
      - '[sound] block.ender_chest.close 100 0.5'
      - '[action] open_gui main_menu'
