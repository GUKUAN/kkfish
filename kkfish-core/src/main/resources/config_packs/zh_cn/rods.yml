# kkfish 鱼竿配置文件
# 鱼竿配置示例
# 你可以通过各种属性和效果创建自定义鱼竿
# 鱼竿配置示例（添加到 rods: 节点下）:
# custom-legendary-rod:
#   difficulty: 0.5 # 难度系数（数值越大越难）
#   float-area-size: 5 # 浮标区域大小百分比
#   durability: 1000 # 耐久度
#   enchantability: 30 # 附魔等级（预留字段，尚未接入）
#   charge-speed: 0.5 # 充能速度倍率（数值越大充能越快）
#   bite-chance-bonus: 0.5 # 咬钩几率加成
#   rare-fish-chance: 0.3 # 稀有鱼类几率倍率
#   material: "DIAMOND_FISHING_ROD" # Minecraft 材质类型
#   custom-model-data: -1 # 自定义模型数据
#   display-name: "&6&l传说级钓鱼竿" # 游戏内显示名称
#   effects: ["LUCK", "LURE"] # 特殊效果
#   # 其他配置项...

# 鱼竿列表
rods:
  # 基础鱼竿
  default:
    difficulty: 1.0 # 难度系数（数值越大越难）
    float-area-size: 30 # 浮标区域大小百分比
    durability: 65 # 耐久度
    enchantability: 15 # 附魔等级
    charge-speed: 1.0 # 充能速度倍率（数值越大充能越快，越容易过充）
    bite-chance-bonus: 0.0 # 咬钩几率加成
    rare-fish-chance: 0.0 # 稀有鱼类几率倍率
    material: "FISHING_ROD" # Minecraft 材质类型
    custom-model-data: -1 # 自定义模型数据
    template: "default" # 物品描述模板
    display-name: "§f木质钓鱼竿" # 游戏内显示名称
  
