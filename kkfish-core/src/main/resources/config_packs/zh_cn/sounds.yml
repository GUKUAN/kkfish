# kkfish 音效配置文件
# 本文件包含钓鱼插件的所有音效设置
# 所有音效均可单独启用/禁用

# ==========================
# 基础音效配置
# ==========================

# 通用设置
settings:
  # 是否启用所有音效
  enabled: true

# ==========================
# 钓鱼过程音效
# ==========================

# 抛竿音效（玩家抛出鱼竿时播放）
cast:
  enabled: true
  name: "ENTITY_FISHING_BOBBER_THROW"  # Bukkit 音效枚举名称
  volume: 1.0  # 音量（0.0 - 1.0）
  pitch: 1.0   # 音调（0.5 - 2.0）

# 咬钩提示音效（"!" 出现时播放）
bite_hint:
  enabled: true
  name: "ENTITY_FISHING_BOBBER_SPLASH"  # 音效名称
  volume: 0.8  # 音量
  pitch: 1.2   # 音调

# 收竿音效（玩家收杆时播放）
reel:
  enabled: true
  name: "ENTITY_FISHING_BOBBER_RETRIEVE"  # 音效名称
  volume: 0.6  # 音量
  pitch: 1.0   # 音调

# ==========================
# 游戏结果音效
# ==========================

# 成功音效（玩家成功钓到鱼时播放）
success:
  enabled: true
  name: "ENTITY_PLAYER_LEVELUP"  # 音效名称
  volume: 1.0  # 音量
  pitch: 1.3   # 音调

# 失败音效（鱼逃跑时播放）
fail:
  enabled: true
  name: "ENTITY_VILLAGER_NO"  # 音效名称
  volume: 0.8  # 音量
  pitch: 0.9   # 音调

# ==========================
# 迷你游戏音效
# ==========================

# 迷你游戏音效（迷你游戏界面更新时播放）
minigame:
  enabled: true
  name: "UI_BUTTON_CLICK"  # 音效名称
  volume: 0.5  # 音量
  pitch: 1.0   # 音调



# 注意：所有音效名称必须是有效的 Bukkit Sound 枚举值
# 完整列表请参见: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Sound.html
# 自定义音效请使用命名空间格式: modid:sound_name
