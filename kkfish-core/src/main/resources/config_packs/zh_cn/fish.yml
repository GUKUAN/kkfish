# kkfish 鱼类配置文件
# 鱼类配置示例
# 你可以通过各种属性和行为创建自定义鱼类
# 鱼类配置示例（添加到 fish: 节点下）:
# custom-legendary-fish:
#   level:
#     - legendary:100
#   activity: 2.0 # （预留字段，尚未接入）
#   min-size: 50
#   max-size: 150
#   value: 1000
#   # 可选：按经济系统拆分出售奖励。不填则 value 跟随 config.yml 的 economy.primary/fallback
#   sell-value:
#     vault: 1000
#     playerpoints: 100
#   biomes: ["OCEAN", "DEEP_OCEAN"]
#   weather: ["THUNDER"]
#   time: ["NIGHT"]
#   seasons: ["SUMMER"]
#   bite-rate-multiplier: 0.3 # （预留字段，尚未接入）
#   description: "一条稀有而强大的鱼"
#   display-name: "&6&l自定义传说级鱼类"
#   material: "TROPICAL_FISH"
#   custom-model-data: -1
#   enchant-glow: true
#   effects: ["FIRE_RESISTANCE 3:60", "WATER_BREATHING 2:120"]
#   movement-amplitude: 2.0
#   command: ["-o say 恭喜 %player%！", "-c give %player% diamond 10"]
#   saturation: 20
#   announcement: true
#   template: "default"
#   # 其他配置项...
fish:
  Carp:
    level:
      - common:70
      - rare:20
      - epic:10
    activity: 1.0
    min-size: 20
    max-size: 60
    value: 10
    item-value:
      - "diamond:1"
      - "iron_ingot:3"
    biomes: ["RIVER", "SWAMP", "BEACH", "FROZEN_RIVER", "PLAINS", "FOREST", "TAIGA", "JUNGLE"]
    weather: ["CLEAR", "RAIN"]
    time: ["ANY"]
    seasons: ["SPRING", "SUMMER", "AUTUMN", "WINTER"]
    bite-rate-multiplier: 1.1
    description: "一种常见的淡水鱼，肉质鲜美，常出没于河流中"
    display-name: "§f鲤鱼"
    material: "COD"
    custom-model-data: -1
    enchant-glow: false
    effects: []
    movement-amplitude: 1.0
    command: []
    saturation: 4
    announcement: false
    template: "simple"

