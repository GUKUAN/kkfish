# config-version: 1.7.10
# - When upgrading to a LATEST version, be sure to read the CHANGELOG in the docs for breaking changes!
#
# IMPORTANT: This plugin fully disables vanilla fishing (unless explicitly enabled).
# Do not use other fishing plugins to avoid conflicts!
config-version: "1.7.10"

# ======================================================================
# Plugin Basic Settings
# ======================================================================

# bStats statistics
bstats:
  # Whether to enable bStats data collection
  enabled: true
# Language configuration
language:
  # Current language (zh_cn=Chinese Simplified, en_us=English)
  current: "en_us"
# Timezone configuration (used by scheduled competitions, etc.)
timezone:
  # Timezone ID (e.g. Asia/Shanghai, America/New_York, UTC). Leave empty to use the server system timezone
  value: "Asia/Shanghai"
# Update check
update-check:
  # Whether to automatically check for plugin updates
  enabled: true
# Debug mode
debug:
  # Whether to enable debug mode (shows detailed debug info in console and in-game when enabled)
  enabled: false
# Visual effects
visual-effects:
  # Whether to enable visual effects such as particles
  enabled: true
  # Fish hook animation settings
  fish-animation:
    # Whether to enable the fish animation
    enabled: true
    # Maximum animation duration in ticks
    max-ticks: 40
    # Peak height of the fish jumping out of the water
    peak-height: 2.5
    # Maximum fish movement speed
    max-speed: 0.5
    # Upward force factor
    upward-force-factor: 0.25
    # Progress ratio at which the peak is reached
    peak-progress: 0.25
    # Minimum Y offset
    min-y-offset: 0.8
    # Fish jumps toward the player
    jump-to-head:
      # Base duration (ticks)
      base-duration: 20
      # Distance multiplier
      distance-multiplier: 5.0
      # Maximum duration (ticks)
      max-duration: 60
      # Initial jump height
      initial-jump-height: 2.0
      # Parabolic curve height
      curve-height: 3.0
      # Easing factor
      easing-factor: 2.0

# ======================================================================
# World & Mode Configuration
# ======================================================================

# World whitelist
world-whitelist:
  # Whether to enable the world whitelist (true=only enabled in whitelisted worlds, false=enabled in all worlds)
  enabled: true
  # List of whitelisted worlds
  worlds:
    - "spawn"
    - "world"
    - "world_nether"
    - "world_the_end"
# Fishing mode switching
mode-switch:
  # Whether players are allowed to switch between plugin fishing and vanilla fishing via command
  allow-command-switch: true
  # Vanilla fishing mode settings
  vanilla-mode:
    # Whether to give custom fish in vanilla fishing mode (true=plugin fish, false=vanilla fish)
    give-custom-fish: true

# ======================================================================
# Core Fishing Settings
# ======================================================================

fishing-settings:
  # Charging & casting
  # Maximum charge time (ms)
  max-charge-time: 3000
  # Cast cooldown (ms)
  cast-cooldown: 5000
  # Bite settings
  # Base bite chance (0.0-1.0)
  base-bite-chance: 0.2
  # Maximum bite chance (0.0-1.0)
  max-bite-chance: 1.0
  # Minimum bite check delay (ms)
  bite-check-delay-min: 5000
  # Maximum bite check delay (ms)
  bite-check-delay-max: 15000
  # Bite hint timeout (seconds)
  bite-hint-timeout: 2
  # Fish escape mechanics, affecting two logic points:
  # 1. Whether fish are forced to escape when the hook flies past the bite timeout (ticks)
  # 2. Whether to roll the chance on bite (false=always bite, true=roll by bite-chance)
  # true=enable escape mechanics, false=disable (always bites)
  escape: false
  # Initial progress percentage (0-100)
  initial-progress: 10
  # Progress bar settings
  progress-bar:
    # Green zone increase speed (higher = faster rise while holding space)
    increase-speed: 0.015
    # Green zone decrease speed (higher = faster fall when space is released)
    decrease-speed: 0.01
    # Rarity impact settings
    rarity-impact:
      # Whether rarity affects the progress bar
      enabled: true
      # Slowdown per rarity level (higher rarity = slower green zone increase)
      slowdown-per-rarity-level: 0.15
      # Minimum increase speed ratio (never lower than this regardless of rarity)
      min-increase-speed-ratio: 0.45
  # Rarity system settings (higher weight = more common fish of that rarity)
  rarity:
    common:
      # Rarity display name (color codes & supported)
      display-name: "&aCommon"
      # Rarity weight
      weight: 50
      # Value multiplier (affects fish sell price)
      value-multiplier: 1.0
      # AuraSkills XP multiplier (if AuraSkills is installed)
      aura-skills-xp-multiplier: 1.0
    uncommon:
      display-name: "&eUncommon"
      weight: 25
      value-multiplier: 1.2
      aura-skills-xp-multiplier: 1.2
    rare:
      display-name: "&9Rare"
      weight: 15
      value-multiplier: 1.5
      aura-skills-xp-multiplier: 1.5
    epic:
      display-name: "&5Epic"
      weight: 8
      value-multiplier: 2.0
      aura-skills-xp-multiplier: 3.0
    legendary:
      display-name: "&6Legendary"
      weight: 2
      value-multiplier: 3.0
      aura-skills-xp-multiplier: 5.0
  # Vanilla experience
  # Whether to enable vanilla fishing experience
  enable-vanilla-exp: true
  # Vanilla fishing experience multiplier
  vanilla-exp-multiplier: 1.0
  # Whether to fully disable vanilla fishing
  disable-vanilla-fishing: false
  # Rod durability
  durability:
    # Maximum durability loss per catch
    max-single-loss: 5
    # Base durability loss per catch
    base-loss: 1

# ======================================================================
# Catch Broadcast Configuration
# ======================================================================

# Fishing broadcast
broadcast:
  # Whether to enable catch broadcast
  enabled: true
  # Broadcast range (global=whole server, world=current world, none=self only)
  range: "global"

# ======================================================================
# Special Fishing Configuration (Lava/Void)
# ======================================================================

# Lava fishing
lava-fishing:
  # Whether to enable lava fishing
  enabled: true
  # Trigger mode (AUTO=automatic, PERMISSION=requires permission, EQUIPMENT=requires equipment effect, BOTH=permission or equipment)
  trigger-mode: AUTO
  # Bite check delay (ms)
  bite-time-min: 100
  bite-time-max: 400
  # Bite chance multiplier
  bite-chance-multiplier: 0.8
  # Minigame settings
  minigame:
    # Difficulty multiplier
    difficulty-multiplier: 1.2
  # Visual & sound settings
  effects:
    # Ambient particle effect
    ambient-particle: FLAME
    ambient-particle-count: 2
    # Bite particle effect
    bite-particle: FLAME
    bite-particle-count: 20
    # Bite sound
    bite-sound: ENTITY_GENERIC_EXTINGUISH_FIRE
    bite-sound-volume: 0.25
    bite-sound-pitch: 1.0

# Void fishing
void-fishing:
  # Whether to enable void fishing
  enabled: true
  # Trigger mode
  trigger-mode: AUTO
  # End void detection settings
  end-detection:
    # Whether to enable void detection in the End
    enabled: true
    # Countdown ticks (20 ticks = 1 second)
    countdown-ticks: 2
    # Whether the hook must be below the player
    require-below-player: true
  # Bite settings
  bite-time-min: 120
  bite-time-max: 500
  bite-chance-multiplier: 0.7
  # Minigame settings
  minigame:
    difficulty-multiplier: 1.5
  # Visual & sound settings
  effects:
    ambient-particle: END_ROD
    ambient-particle-count: 1
    bite-particle: END_ROD
    bite-particle-count: 20
    bite-sound: ITEM_TRIDENT_THUNDER
    bite-sound-volume: 0.25
    bite-sound-pitch: 1.0

# ======================================================================
# Progress Bar Style Configuration
# ======================================================================

styles:
  default:
    progress-char: "&9="
    progress-bar-empty-char: "&7-"
    green-bar-char: "&a|"
    green-bar-edge-char: "&2|"
    background-char: "&7|"
    fish-indicator-char: "&9|||"
  lava:
    progress-char: "&6="
    progress-bar-empty-char: "&8-"
    green-bar-char: "&c|"
    green-bar-edge-char: "&4|"
    background-char: "&8|"
    fish-indicator-char: "&e|||"
  void:
    progress-char: "&5═"
    progress-bar-empty-char: "&8─"
    green-bar-char: "&d|"
    green-bar-edge-char: "&5|"
    background-char: "&8|"
    fish-indicator-char: "&b|||"

# ======================================================================
# Economy Configuration
# ======================================================================

economy:
  # Master switch for economy (controls selling, shop, hooks and all economy-related features)
  enabled: true
  # Vault economy integration
  economy: true
  # PlayerPoints economy integration
  playerpoints: true
  # Which economy system the legacy fish.yml value uses: vault / playerpoints
  primary: vault
  # Whether to automatically try the other available economy system when primary is unavailable
  fallback: true
  # Selling feature
  sell: true
  # Sell GUI feature
  sellgui: true

# ======================================================================
# Seasonal Configuration
# ======================================================================

seasonal:
  # Whether to enable seasonal features
  enabled: true
  # Fish price fluctuation settings
  price-fluctuation:
    # Whether to enable fish price fluctuation
    enabled: true
    # Price multiplier per season (relative to base)
    spring: 0.1
    summer: 0.2
    autumn: -0.1
    winter: -0.2
    # Base price fluctuation
    base: 0.05

# ======================================================================
# Database Configuration
# ======================================================================

database:
  # Database type (sqlite or mysql)
  type: "sqlite"
  # SQLite settings
  sqlite:
    # Database file name
    file: "data.db"
    # Write lock wait timeout (ms). When multiple threads write at the same time,
    # SQLite waits for the lock instead of throwing "database is locked"
    busy-timeout: 5000
  # MySQL settings (only used when type=mysql)
  mysql:
    # MySQL server address
    host: "localhost"
    # MySQL port
    port: 3306
    # Database name
    database: "kkfish"
    # Username
    username: "root"
    # Password
    password: "password"
    # Table prefix
    table-prefix: "kkfish_"
    # Whether to use SSL
    use-ssl: false
    # Connection timeout (ms)
    timeout: 30000

# ======================================================================
# Backup Configuration
# ======================================================================

backup:
  # Whether to auto-backup existing configs before upgrades / language switches
  enabled: true
  # Backup retention time (seconds)
  retention-seconds: 604800

# ======================================================================
# Item Template Configuration
# ======================================================================

item-templates:
  # Fish item templates
  fish-templates:
    default:
      content: |-
        &6┏━━━━━━━ 🐟 FISH DETAILS 🐟 ━━━━━━━┓
        &b┃ Name: &f%name%
        &a┃ Size: &f%size%&a cm
        &c┃ Value: &f%value%&c coins
        &d┃ Rarity: &f%rarity%
        &6┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛
        &d✨ Special Effects:
        &7➤ %effects%
        &7
    simple:
      content: |-
        &b🐠 Name: %name%
        &a📏 Size: %size% cm
        &c💰 Value: %value% coins
        &d💎 Rarity: %rarity%
        &d✨ Special Effects:
        &7➤ %effects%
  # Rod item templates
  rod-templates:
    default:
      content: |-
        &6┏━━━━━━━ 🎣 ROD PROPERTIES 🎣 ━━━━━━━┓
        &b┃ Difficulty: &f%difficulty%
        &a┃ Float Area: &f%float_area%
        &c┃ Durability: &f%durability%
        &d┃ Charge Speed: &f%charge_speed%
        &5┃ Bite Rate Bonus: &f%bite_rate_bonus%
        &6┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛
        &e✨ Special Effects:
        &7➤ %effects%
        &7🎣 Happy Fishing!
    compact:
      content: |-
        &b🎣 Core Rod Properties:
        &b├─ Difficulty: %difficulty% | Float Range: %float_area%
        &c├─ Durability: %durability%
        &d└─ Charge Speed: %charge_speed% | Bite Bonus: %bite_rate_bonus%
        &e✨ Special Effects: %effects%
  # Hook item templates
  hook-templates:
    default:
      content: |-
        &6┏━━━━━━━ 🪝 HOOK INFO 🪝 ━━━━━━━┓
        &7┃ Level: &f%level%
        %rarity_color%┃ Rarity: &f%rarity_name%
        &7┃ Description: &f%description%
        &6┠━━━━━━━ 📊 PERFORMANCE 📊 ━━━━━━━┨
        &7┃ %performance_metrics%
        &6┠━━━━━━━ 📋 STATUS 📋 ━━━━━━━┨
        &7┃ %status_info%
        &6┠━━━━━━━ ⚙️ EQUIPMENT ⚙️ ━━━━━━━┨
        &7┃ %equipment_info%
        &6┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛
    simple:
      content: |-
        &7🪝 %rarity_color%%rarity_name%&7 | Level: %level%
        &7📝 %description%
        &7📊 Performance: %performance_metrics%
        &7📋 Status: %status_info%
        &7⚙️ Equipment: %equipment_info%
  # Bait item templates
  bait-templates:
    default:
      content: |-
        &6┏━━━━━━━ 🦐 BAIT DETAILS 🦐 ━━━━━━━┓
        &b┃ Name: &f%name%
        &7┃ Description: &f%description%
        &6┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛
        &d✨ Bait Effects:
        &7➤ %effects%
        &7
    compact:
      content: |-
        &b🦐 Name: %name%
        &7📝 Description: %description%
        &d✨ Effects:
        &7➤ %effects%
