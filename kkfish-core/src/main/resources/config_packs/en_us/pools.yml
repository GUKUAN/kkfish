# kkfish Pools Configuration
# Pools group fish by water type. When fishing, the plugin draws from the pool matching the water type.
# Supported water types:
#   water - normal water (default)
#   lava  - lava pool (requires lava-fishing enabled in config.yml)
#   void  - void pool (requires void-fishing enabled in config.yml)
# Note: fish names in a pool must exist in fish.yml, otherwise they are ignored with a warning.
# Water pool
water:
  - Carp
  - GrassCarp
  - Goldfish
  - Bass
  - DragonFish
  - FlyingFish
  - XuFuFish

# Lava pool - uncomment and add the matching fish.yml definitions to activate
# lava:
#   - MagmaFish
#   - FlameEel
#   - NetheriteKoi

# Void pool - uncomment and add the matching fish.yml definitions to activate
# void:
#   - VoidWraith
#   - EnderDragonFry
